[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["notebooks", ".venv", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "(notebooks|.venv|models|data)"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["notebooks", ".venv", "models", "data"]
