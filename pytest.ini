[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    unit: fast isolated unit tests (tests/unit)
    integration: multi-component tests without external APIs (tests/integration)
    safety: adversarial / safety-critical tests (tests/security)
    retrieval: retrieval / Chroma tests
    e2e: end-to-end pipeline tests
    slow: tests that are slow to run (e.g. model loading)

